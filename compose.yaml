name: Server-fuzzy

services:
  fuzzy-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      INFLUX_URL: "${INFLUX_URL:?Configure INFLUX_URL no arquivo .env}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:?Configure INFLUX_TOKEN no arquivo .env}"
      MQTT_HOST: "${MQTT_HOST:?Configure MQTT_HOST no arquivo .env}"
      MQTT_PASS: "${MQTT_PASS:?Configure MQTT_PASS no arquivo .env}"
    ports:
      - "${API_PORT:-8001}:8000"
